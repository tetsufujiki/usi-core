name: CMS News Sync

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-wordpress-news
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'tetsufujiki/usi-core'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync CMS News
        run: pnpm cms:update

      - name: Build
        run: pnpm build

      - name: Check for CMS News updates
        id: changes
        run: |
          if git diff --quiet -- lib/news/generated/posts.json lib/news/generated/redirects.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No CMS news changes to commit."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "CMS news changes detected."
          fi

      - name: Commit and push CMS News updates
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/news/generated/posts.json lib/news/generated/redirects.json
          git commit -m "chore: refresh wordpress news data"
          git push origin HEAD:main
