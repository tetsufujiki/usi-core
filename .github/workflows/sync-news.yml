name: Sync WordPress News

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-wordpress-news
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'tetsufujiki/usi-core'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync WordPress News
        run: pnpm news:sync

      - name: Check for News updates
        id: changes
        run: |
          if git diff --quiet -- lib/news/generated/posts.json lib/news/generated/redirects.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify generated News
        if: steps.changes.outputs.changed == 'true'
        run: |
          pnpm typecheck
          pnpm build

      - name: Commit and push generated News
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/news/generated/posts.json lib/news/generated/redirects.json
          git commit -m "chore: sync cms news"
          git push origin HEAD:main
